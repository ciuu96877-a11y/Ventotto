# Builds the Web version of Ventotto from main and publishes it to GitHub Pages.
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  PROJECT_DIR: outputs/Ventotto

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Godot binary + the single-threaded web template (the full .tpz is ~1.3 GB,
      # so only web_nothreads_release.zip is kept and cached).
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Download Godot and web template
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tdir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$tdir"
          unzip -q -j /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$tdir"
          rm /tmp/godot.zip /tmp/templates.tpz

      # Imported resources (.godot/) take a while to build; reuse them between runs.
      - name: Cache imported resources
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/.godot
          key: import-${{ env.GODOT_VERSION }}-${{ hashFiles('outputs/Ventotto/assets/**', 'outputs/Ventotto/**/*.import') }}
          restore-keys: import-${{ env.GODOT_VERSION }}-

      - name: Import project
        run: ~/godot/godot --headless --path "$PROJECT_DIR" --import

      - name: Export Web
        run: |
          mkdir -p build
          ~/godot/godot --headless --path "$PROJECT_DIR" --export-release "Web" "$GITHUB_WORKSPACE/build/index.html"
          test -s build/index.pck && test -s build/index.wasm

      - name: Report size
        run: |
          {
            echo "### Web build"
            echo '```'
            ls -l build
            du -sh build
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # GitHub Pages accepts sites up to 1 GB.
          size=$(du -sb build | cut -f1)
          if [ "$size" -gt 1000000000 ]; then
            echo "::error::Web build is $size bytes, over the 1 GB GitHub Pages limit"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
